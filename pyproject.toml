[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-comment-scrapper"
version = "2.1.0"
description = "Scrape all comments and replies from a TikTok video by URL or ID."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Romy Saputra Sihananda"}
]
keywords = ["tiktok", "scraper", "comments", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "curl-cffi",
    "click>=8.1.7",
    "jmespath>=1.0.1",
    "loguru>=0.7.2",
]

[project.scripts]
comment-scraper = "tiktokcomment.cli:main"

[project.urls]
Homepage = "https://github.com/romysaputrasihananda/tiktok-comment-scrapper"
Repository = "https://github.com/romysaputrasihananda/tiktok-comment-scrapper.git"

# --- THIS IS THE CRITICAL FIX FOR THE BUILD ERROR ---
[tool.setuptools.packages.find]
include = ["tiktokcomment*"]